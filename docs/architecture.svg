<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="title desc">
  <title id="title">Next.js app stack</title>
  <desc id="desc">Next.js 16 contains the portrait bench UI, Zustand, server actions, MediaPipe, TypeScript, and Vitest. SQLite and local files are a footnote for this version.</desc>
  <rect width="880" height="640" fill="#E4E7EC"/>
  <rect x="28" y="24" width="824" height="592" fill="#F4F6F8" stroke="#101418" stroke-width="2"/>
  <text x="52" y="64" fill="#101418" font-family="Segoe UI, Helvetica, sans-serif" font-size="24" font-weight="650">Next.js 16</text>
  <text x="52" y="92" fill="#5E6A75" font-family="Segoe UI, Helvetica, sans-serif" font-size="15">One app. The browser finds the face. The server recomputes the score.</text>

  <rect x="52" y="116" width="360" height="78" fill="#E4E7EC" stroke="#B7C0C8"/>
  <text x="68" y="146" fill="#101418" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="650">React 19 and Tailwind 4</text>
  <text x="68" y="170" fill="#5E6A75" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">Portrait bench UI</text>

  <rect x="432" y="116" width="388" height="78" fill="#E4E7EC" stroke="#B7C0C8"/>
  <text x="448" y="146" fill="#101418" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="650">Zustand</text>
  <text x="448" y="170" fill="#5E6A75" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">File, preview, drag, register or sign-in, reveal</text>

  <rect x="52" y="214" width="768" height="86" fill="#E4E7EC" stroke="#0E4D6C" stroke-width="2"/>
  <text x="68" y="246" fill="#101418" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="650">Server actions</text>
  <text x="68" y="272" fill="#5E6A75" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">Register, sign in, sign out, and readSmile. A missing face or a bad file stops here.</text>

  <rect x="52" y="320" width="768" height="86" fill="#E4E7EC" stroke="#B7C0C8"/>
  <text x="68" y="352" fill="#101418" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="650">MediaPipe Face Landmarker</text>
  <text x="68" y="378" fill="#5E6A75" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">Runs in the browser. Landmarks are passed into readSmile. The client score is not trusted.</text>
  <line x1="436" y1="320" x2="436" y2="300" stroke="#0E4D6C" stroke-width="2"/>
  <polygon points="430,300 442,300 436,290" fill="#0E4D6C"/>

  <rect x="52" y="426" width="360" height="72" fill="#E4E7EC" stroke="#B7C0C8"/>
  <text x="68" y="456" fill="#101418" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="650">TypeScript</text>
  <text x="68" y="478" fill="#5E6A75" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">Across the app</text>

  <rect x="432" y="426" width="388" height="72" fill="#E4E7EC" stroke="#B7C0C8"/>
  <text x="448" y="456" fill="#101418" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="650">Vitest</text>
  <text x="448" y="478" fill="#5E6A75" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">Scoring function and the actions</text>

  <text x="52" y="548" fill="#5E6A75" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">This version: SQLite for users and portrait rows, portrait files on disk.</text>
  <text x="52" y="572" fill="#5E6A75" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">Both live under data/ and stay out of git. They are not a second system.</text>
</svg>
